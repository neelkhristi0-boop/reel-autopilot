name: Reel Autopilot

on:
  schedule:
    - cron: "7,37 * * * *"   # checks every 30 minutes; only works when a reel is due
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = post what is due | test = make one reel, do not post | post-now = make and post one now"
        type: choice
        default: test
        options: [auto, test, post-now]
      page:
        description: "Page id from pages.yaml (needed for test and post-now)"
        default: insider-story

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      META_TOKEN: ${{ secrets.META_TOKEN }}
      MODE: ${{ inputs.mode || 'auto' }}
      PAGE: ${{ inputs.page }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt

      - name: Check what is due and refresh stats
        id: check
        run: |
          python -m autopilot.run --check
          if [ "$MODE" != "auto" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install video tools
        if: steps.check.outputs.due == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-noto-core fonts-noto-color-emoji
      - uses: actions/setup-node@v4
        if: steps.check.outputs.due == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: composer/package-lock.json
      - name: Install composer
        if: steps.check.outputs.due == 'true'
        run: cd composer && npm ci --no-audit --no-fund && npx remotion browser ensure

      - name: Make and post reels
        if: steps.check.outputs.due == 'true'
        run: |
          case "$MODE" in
            test)     python -m autopilot.run --page "$PAGE" --force --dry-run ;;
            post-now) python -m autopilot.run --page "$PAGE" --force ;;
            *)        python -m autopilot.run ;;
          esac

      - name: Keep the videos for 5 days
        if: steps.check.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.txt
          retention-days: 5
          if-no-files-found: ignore

      - name: Save dashboard data
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/state.json
          git diff --cached --quiet || (git commit -q -m "autopilot: update state" && git pull -q --rebase && git push -q)
