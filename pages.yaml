  # A CLIPPING page: give it a Google Drive folder of long videos YOU own (or have permission to use).
  # It cuts one captioned clip per time slot and never reuses the same part.
  - id: clips-page
    name: Clips page (template)
    instagram: ""
    enabled: false
    mode: clips
    drive_folder: ""        # folder link, shared as "Anyone with the link can view"
    clip_seconds: [20, 45]
    accent: "#22c55e"
    times: ["11:00", "17:00", "21:30"]
    niche: Describe what the source videos are about.
